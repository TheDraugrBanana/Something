

<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Serpant Gaming</title>

<style>

* {

    margin: 0;

    padding: 0;

    box-sizing: border-box;

}

body {

    background: #050505;

    color: #00ff55;

    font-family: Arial, sans-serif;

    text-align: center;

}

header {

    padding: 50px 20px;

    background: #080808;

    border-bottom: 2px solid #00ff55;

    box-shadow: 0 0 20px #00ff55;

}

h1 {

    font-size: 42px;

    text-shadow: 0 0 15px #00ff55;

}

header p {

    color: #aaa;

    margin-top: 12px;

}

.container {

    padding: 40px 20px;

}

h2 {

    margin-bottom: 25px;

}

.buttons {

    display: grid;

    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));

    gap: 20px;

    max-width: 800px;

    margin: auto;

}

.buttons a {

    display: block;

    padding: 18px;

    color: #00ff55;

    background: #101010;

    border: 2px solid #00ff55;

    border-radius: 10px;

    text-decoration: none;

    font-weight: bold;

    transition: 0.3s;

}

.buttons a:hover {

    background: #00ff55;

    color: black;

    box-shadow: 0 0 20px #00ff55;

    transform: scale(1.06);

}

footer {

    margin-top: 60px;

    padding: 20px;

    border-top: 1px solid #00ff55;

    color: #777;

}

</style>

</head>

<body>

<header>

    <h1>🐍 SERPANT GAMING</h1>

    <p>Welcome to the ultimate gaming zone</p>

</header>

<div class="container">

    <h2>GAMING MENU</h2>

    <div class="buttons">

        <a href="https://www.youtube.com" >YouTube</a>

        <a href="https://www.twitch.tv">Twitch</a>

        <a href="https://www.discord.com">Discord</a>

        <a href="https://www.roblox.com">Roblox</a>

        <a href="https://www.minecraft.net">Minecraft</a>

        <a href="https://store.steampowered.com">Steam</a>

        <a href="https://www.epicgames.com">Epic Games</a>

        <a href="https://www.playstation.com">PlayStation</a>

        <a href="https://www.xbox.com">Xbox</a>

        <a href="https://www.tiktok.com">TikTok</a>

    </div>

</div>

<footer>

    <p>© 2026 Serpant Gaming | All Rights Reserved</p>

</footer>

</body>

</html>
